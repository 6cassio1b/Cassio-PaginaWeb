<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog</title>
        <style>
            header{
                background-color: #183C63;
                color: #FFFF;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                border: 5px solid #ff0000;
            }
            main{
                background-color: #FFFF;
                color: #183C63;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                display: flex;
            }
            img{
                width: 100px;
                height: 100px;
            }
           .artigo-autor{
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
    </header>
    <main>
        <img src="imagem-blog,jpg"alt="Logotipoconceitual de tecnolgia e educação: uma lampada  de onde emerge varias ideias referentes a tecnologia.">
        <div>
            <h2> Meu primeiro post</h2>
            <p class="artigo-autor">Por: Cássio</p>
            <p>Boas-vindas ao meu blog! aqui vou compartilhar dicas de programação e curiosidades da área de teclonolgia.</p>
            <button>👍 <span>0</span></button>
        </div>
    </main>
</body>
<script>
    const botao = document.querySelector("button");
    botao.addEventListener("click", botaoClicado);
  

    function botaoClicado(){
        console.log("fui clicado");
        let texto = botao.querySelector("span");
        texto.textContent++;
    }
</script>
</html>
